<h2>解析配置文件路径</h2>

<h3>Description</h3>

<p>按顺序探测: 环境变量 DIANN_GUI_CONFIG → ~/.diann_gui/config.R →
&lt;dir&gt;/config.R。均不存在返回 &quot;&quot; (内置默认 = 用户家目录模式)。
</p>


<h3>Usage</h3>

<pre><code class='language-R'>resolve_user_config(dir = getwd())
</code></pre>


<h3>Arguments</h3>

<table role = "presentation">
<tr><td><code id="dir">dir</code></td>
<td>
<p>工作目录 (中央部署时为应用目录)</p>
</td></tr>
