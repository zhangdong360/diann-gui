<h3>Description</h3>

<p>读取包配置环境中的配置值。</p>


<h3>Usage</h3>

<pre><code class='language-R'>cfg_get(key, default = NULL)
</code></pre>


<h3>Arguments</h3>

<table role = "presentation">
<tr><td><code id="key">key</code></td>
<td>
<p>配置键 (如 &quot;DATA_HOME&quot;、&quot;BASE_VOLUMES&quot;)</p>
</td></tr>
<tr><td><code id="default">default</code></td>
<td>
<p>未设置时返回的默认值</p>
</td></tr>
