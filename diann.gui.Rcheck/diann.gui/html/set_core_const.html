<h2>写入配置值 (注入接口)</h2>

<h3>Description</h3>

<p>向包配置环境写入配置值。主要供测试与站点注入使用;
调用后无需重新加载即可被各模块读到。</p>


<h3>Usage</h3>

<pre><code class='language-R'>set_core_const(key, value)
</code></pre>


<h3>Arguments</h3>

<table role = "presentation">
<tr><td><code id="key">key</code></td>
<td>
<p>配置键</p>
</td></tr>
<tr><td><code id="value">value</code></td>
<td>
<p>配置值</p>
</td></tr>
</table>
