name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  r-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install package
        run: |
          OUT=$(R CMD INSTALL --no-multiarch . 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qE "^\* DONE"; then
            echo "install OK"
          else
            echo "$OUT" | grep -inE "error|undefined|no package|cannot|loading failed" | head -12 | while IFS= read -r l; do echo "::error::${l:0:250}"; done
            exit 1
          fi

      - name: Run R test suite
        run: |
          Rscript - <<'RS'
          res <- testthat::test_dir("tests/testthat", stop_on_failure = FALSE)
          df <- as.data.frame(res)
          print(df[, c("file", "test", "failed", "error")])
          bad <- df[df$failed > 0 | df$error, ]
          if (nrow(bad)) for (i in seq_len(nrow(bad))) {
            msg <- trimws(gsub("[\\r\\n]+", " | ", bad$message[i]))
            cat(sprintf("::error file=%s::%s / %s :: %s\n",
                        bad$file[i], bad$file[i], bad$test[i], substr(msg, 1, 500)))
          }
          cat("::notice::", sessionInfo()$R.version$version.string,
              "| testthat", as.character(packageVersion("testthat")),
              "| shiny", as.character(packageVersion("shiny")), "\n")
          quit(status = if (any(df$error) || sum(df$failed) > 0) 1 else 0)
          RS

      - name: Synthetic-ID allowlist scan
        run: python3 tests/check_synthetic_ids.py

      - name: Launcher syntax check
        run: bash -n bin/diann-gui

      - name: Python syntax check
        run: python3 -m py_compile inst/python/mail_notify.py

  app-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install package
        run: |
          OUT=$(R CMD INSTALL --no-multiarch . 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qE "^\* DONE"; then
            echo "install OK"
          else
            echo "$OUT" | grep -inE "error|undefined|no package|cannot|loading failed" | head -12 | while IFS= read -r l; do echo "::error::${l:0:250}"; done
            exit 1
          fi

      - name: Install browser stack
        run: |
          python3 -m pip install --user selenium
          firefox --version
          geckodriver --version

      - name: Smoke (app object builds, no site config needed)
        run: |
          Rscript - <<'RS'
          r <- tryCatch({
            invisible(library(diann.gui))
            invisible(run_app())
            cat("smoke OK\n")
          }, error = function(e) {
            cat(sprintf("::error::包装载失败: %s\n", conditionMessage(e)))
            quit(status = 1)
          })
          RS

      - name: Browser E2E (import regression, 3 fixtures)
        run: bash tests/e2e/run_e2e.sh
