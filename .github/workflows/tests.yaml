name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  r-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install package
        run: R CMD INSTALL --no-multiarch .

      - name: Run R test suite
        run: |
          Rscript - <<'RS'
          res <- testthat::test_dir("tests/testthat", stop_on_failure = FALSE)
          df <- as.data.frame(res)
          print(df[, c("file", "test", "failed", "error")])
          bad_idx <- which(df$failed > 0 | df$error)
          if (length(bad_idx)) for (i in bad_idx) {
            msg <- tryCatch(res[[i]]$message, error = function(e) "")
            cat(sprintf("::error file=%s::%s :: %s\n",
                        df$file[i], df$test[i], substr(gsub("[\\r\\n]+", " | ", msg), 1, 500)))
          }
          cat("::notice::", sessionInfo()$R.version$version.string,
              "| testthat", as.character(packageVersion("testthat")), "\n")
          quit(status = if (any(df$error) || sum(df$failed) > 0) 1 else 0)
          RS

      - name: Python unit tests
        run: python3 -m unittest discover -s tests/python -v

      - name: Synthetic-ID allowlist scan
        run: python3 tests/check_synthetic_ids.py

      - name: Python syntax check
        run: python3 -m py_compile inst/python/mail_notify.py

  r-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: R CMD build
        run: R CMD build --no-build-vignettes .

      - name: R CMD check (no ERROR allowed)
        run: |
          R CMD check --no-manual --no-build-vignettes diann.gui_*.tar.gz || true
          LOG="$(ls -d diann.gui.Rcheck)/00check.log"
          tail -40 "$LOG"
          if grep -qE "^Status:.*ERROR" "$LOG"; then
            echo "::error::R CMD check 出现 ERROR"
            exit 1
          fi
          if grep -qE "WARNING" "$LOG"; then
            echo "::warning::R CMD check 有已知的非 ASCII 警告 (中文界面文案)，不阻断发布"
          fi

  app-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install package
        run: R CMD INSTALL --no-multiarch .

      - name: Install browser stack
        run: |
          python3 -m pip install --user selenium
          sudo apt-get update
          sudo apt-get install -y firefox

      - uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke (app object builds)
        run: |
          Rscript - <<'RS'
          r <- tryCatch({
            app <- diann.gui::run_app(app_only = TRUE)
            stopifnot(inherits(app, "shiny.appobj"))
            cat("smoke OK\n")
          }, error = function(e) {
            cat(sprintf("::error::应用构建失败: %s\n", conditionMessage(e)))
            quit(status = 1)
          })
          RS

      - name: Package-level launch smoke (tarball -> user lib -> run_app)
        run: |
          R CMD build --no-build-vignettes .
          LIB="$(mktemp -d)"
          R CMD INSTALL --no-multiarch -l "$LIB" diann.gui_*.tar.gz
          cd /tmp
          env HOME="$(mktemp -d)" R_LIBS="$LIB" \
            Rscript -e "diann.gui::run_app(port = 4850, host = '127.0.0.1', launch.browser = FALSE)" &
          APP_PID=$!
          code=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:4850/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          kill "$APP_PID" 2>/dev/null || true
          [ "$code" = "200" ] || { echo "::error::包级启动冒烟失败 (http=$code)"; exit 1; }
          echo "package launch smoke OK"

      - name: Browser E2E (import + apptainer)
        run: bash tests/e2e/run_e2e.sh
